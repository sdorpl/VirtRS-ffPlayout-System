# VizRS graphics + VizRS ffPlayout System on one server (e.g. Oracle Cloud Ampere A1, arm64).
#
#   cp env.example .env   # set passwords and the VizRS source path
#   docker compose up -d
#
# Panel: http://<server>:8787  ·  VizRS Trio: http://<server>:8088/trio
# Channel settings → General → VizRS graphics:
#   Address  vizrs:6100
#   Token    the VIZRS_TOKEN below
#   Burn-in  http://vizrs:8088/output?token=<VIZRS_OUTPUT_TOKEN>   (read-only token)
# Put both behind HTTPS (Caddy/nginx) before opening the ports to the internet.

services:
  vizrs:
    # VizRS has no published image: built from its repository (Dockerfile in the root).
    build: ${VIZRS_SRC:-../../../VizRS CG System}
    restart: unless-stopped
    environment:
      VIZRS_TOKEN: ${VIZRS_TOKEN:?set VIZRS_TOKEN}
      VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:?set VIZRS_OUTPUT_TOKEN}
      VIZRS_TCP: "6100"
    volumes:
      - vizrs-data:/data
    ports:
      - "8088:8088"

  playout:
    image: ${PLAYOUT_IMAGE:-ghcr.io/sdorpl/vizrs-ffplayout:main}
    restart: unless-stopped
    depends_on:
      - vizrs
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    # Chromium uses /dev/shm for rendering; the Docker default (64 MB) is too small.
    shm_size: 512mb
    volumes:
      - playout-data:/data
    ports:
      - "8787:8787"

volumes:
  vizrs-data:
  playout-data:
