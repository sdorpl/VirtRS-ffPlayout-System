# Portainer stack (Stacks → Add stack → Web editor): VizRS + VizRS ffPlayout System.
# Images only, no build: ghcr.io/sdorpl/vizrs (VizRS CG System) and
# ghcr.io/sdorpl/vizrs-ffplayout, both linux/amd64 + linux/arm64.
# Set VIZRS_TOKEN, VIZRS_OUTPUT_TOKEN and ADMIN_PASSWORD under "Environment variables".

services:
  vizrs:
    image: ghcr.io/sdorpl/vizrs:latest
    restart: unless-stopped
    environment:
      VIZRS_TOKEN: ${VIZRS_TOKEN}
      VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN}
      VIZRS_TCP: "6100"
    volumes:
      - vizrs-data:/data
    ports:
      - "8088:8088"

  playout:
    image: ghcr.io/sdorpl/vizrs-ffplayout:main
    restart: unless-stopped
    depends_on:
      - vizrs
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    shm_size: 512mb
    volumes:
      - playout-data:/data
    ports:
      - "8787:8787"

volumes:
  vizrs-data:
  playout-data:
